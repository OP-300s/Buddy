<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buddy, an AI chatbot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1FB;--surface:#FFFFFF;--ink:#1B2038;--muted:#5B6285;--line:#D9DEF3;
  --me:#3D4DFF;--me-ink:#FFFFFF;--accent:#FFC93C;--accent-ink:#1B2038;--err:#B3261E;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12152A;--surface:#1D2140;--ink:#EDEFFF;--muted:#9AA2D0;--line:#2D3260;--me:#4C5BFF;--err:#FF8A80;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12152A;--surface:#1D2140;--ink:#EDEFFF;--muted:#9AA2D0;--line:#2D3260;--me:#4C5BFF;--err:#FF8A80;color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:400 16px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.face{width:40px;height:40px;border-radius:12px;background:var(--me);display:flex;align-items:center;justify-content:center;gap:7px;flex:none}
.face i{display:block;width:7px;height:11px;border-radius:4px;background:#fff}
.busy .face i{animation:look .9s ease-in-out infinite alternate}
.busy .face i:nth-child(2){animation-delay:.25s}
@keyframes look{to{transform:translateY(-3px) scaleY(.6)}}
@media (prefers-reduced-motion:reduce){.busy .face i{animation:none}}
.who{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0}
.who b{font-weight:600;font-size:17px}
.who span{font-size:13px;color:var(--muted)}
.ghost{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.ghost:disabled{opacity:.5;cursor:default}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:6px}
.wait{color:var(--muted)}
.note{align-self:flex-start;max-width:85%;font-size:14px;color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.composer{padding:10px 12px 12px;background:var(--surface);border-top:1px solid var(--line)}
.row{display:flex;align-items:flex-end;gap:8px}
textarea{flex:1;min-width:0;font:inherit;line-height:1.35;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:11px 16px;resize:none;max-height:120px}
#send{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
#send:disabled{opacity:.4;cursor:default}
textarea:focus-visible,button:focus-visible{outline:3px solid var(--me);outline-offset:2px}
</style>
</head>
<body>
<header class="top">
  <div class="face" aria-hidden="true"><i></i><i></i></div>
  <div class="who"><b>Buddy</b><span>AI chatbot</span></div>
  <button id="reset" class="ghost" type="button">New chat</button>
</header>
<main id="log" class="log" aria-live="polite"></main>
<div class="composer">
  <div class="row">
    <textarea id="box" rows="1" placeholder="Message Buddy" aria-label="Message"></textarea>
    <button id="send" type="button" aria-label="Send message" disabled>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>
<script>
(function () {
  var RULES = "You are Buddy, a friendly chatbot on a small web page. Chat like a kind, curious friend. " +
    "Keep replies short, usually 1 to 4 sentences, in plain text with no markdown symbols. Ask at most one question at a time. " +
    "Reply in the language the person writes in. If asked, say you are an AI chatbot, and be honest when you don't know something. " +
    "If someone seems upset or unsafe, be caring and suggest talking to a trusted adult or local emergency services. " +
    "Never ask for personal details like a full name, address, school or passwords.";
  var GREETING = "Hi, I’m Buddy, an AI chatbot. Ask me anything, or pick one to start.";
  var CHIPS = ["Tell me a fun fact", "Give me a Roblox game idea", "Tell me a joke"];
  var ERR = {
    unavailable: "Chat isn’t available on this page. Open it in Claude to talk.",
    not_granted: "Chat needs permission to use Claude. Reload the page and choose Allow when asked.",
    sampling_disabled: "Chat isn’t available on this account.",
    capability_disabled: "Chat isn’t available on this account.",
    rate_limited: "You’ve hit a message or usage limit. Wait a bit, then send again.",
    session_expired: "Your session expired. Sign in again, then send your message.",
    refused: "That message couldn’t be answered. Try asking it a different way.",
    empty_completion: "No answer came back. Try rephrasing your message.",
    upstream_error: "The connection dropped. Send your message again."
  };
  var log = document.getElementById("log"), box = document.getElementById("box");
  var send = document.getElementById("send"), reset = document.getElementById("reset");
  var history = [], busy = false;
  var coarse = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  var samplePromise = (window.claude && window.claude.use)
    ? window.claude.use("sample").catch(function () { return null; })
    : Promise.resolve(null);

  function add(cls, text) {
    var d = document.createElement("div");
    d.className = cls;
    if (text != null) d.textContent = text;
    log.appendChild(d);
    return d;
  }
  function toBottom() { log.scrollTop = log.scrollHeight; }
  function refresh() { send.disabled = busy || !box.value.trim(); }
  function grow() { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 120) + "px"; }
  function setBusy(v) { busy = v; document.body.classList.toggle("busy", v); reset.disabled = v; refresh(); }

  function start() {
    log.textContent = "";
    history = [];
    add("msg bot", GREETING);
    var c = add("chips");
    CHIPS.forEach(function (t) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = t;
      b.onclick = function () { ask(t); };
      c.appendChild(b);
    });
  }

  async function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    var chips = log.querySelector(".chips");
    if (chips) chips.remove();
    log.querySelectorAll(".note").forEach(function (n) { n.remove(); });
    var mine = add("msg me", text);
    history.push({ role: "user", content: text });
    box.value = ""; grow();
    setBusy(true);
    var bubble = add("msg bot wait", "Thinking…");
    toBottom();
    try {
      var sample = await samplePromise;
      if (!sample) throw { code: "unavailable" };
      var res = await sample([{ role: "user", content: RULES }].concat(history), {
        cache: false,
        modelTier: "quick",
        onText: function (o) { bubble.className = "msg bot"; bubble.textContent = o.text; toBottom(); }
      });
      bubble.className = "msg bot";
      bubble.textContent = res.text;
      history.push({ role: "assistant", content: res.text });
    } catch (e) {
      var code = (e && e.code) || "upstream_error";
      var note = ERR[code] || ERR.upstream_error;
      if (e && e.text && code !== "refused") {
        bubble.className = "msg bot";
        bubble.textContent = e.text;
        history.push({ role: "assistant", content: e.text });
      } else {
        bubble.remove(); mine.remove(); history.pop();
        box.value = text; grow();
      }
      add("note", note);
    }
    setBusy(false);
    toBottom();
    if (!coarse) box.focus();
  }

  box.addEventListener("input", function () { grow(); refresh(); });
  box.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); ask(box.value); }
  });
  send.onclick = function () { ask(box.value); };
  reset.onclick = start;
  start();
})();
</script>
</body>
</html>
